name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Test the harness itself
        run: pytest -q
      - name: Run the evals and fail if anything got worse than the baseline
        run: python evals.py --agent good --compare baseline.json
